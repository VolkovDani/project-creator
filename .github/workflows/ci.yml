name: CI
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.txt'
      - '**/requirements*.txt'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.txt'
      - '**/requirements*.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: project_creator
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: project_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_creator -d project_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://project_creator:ci-test-password@127.0.0.1:5432/project_creator_test?sslmode=disable
      E2E_DATABASE_URL: postgresql://project_creator:ci-test-password@127.0.0.1:5432/project_creator_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Prepare isolated E2E database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE project_creator_e2e'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify offline classification metrics and taxonomy fixtures
        run: |
          python3 -B scripts/classification-evaluator_test.py
          python3 -B scripts/classification_benchmark_test.py
          python3 -B scripts/classification-evaluator.py --contract contracts/classification.json --examples testdata/classification/synthetic.json --self-check > /dev/null
      - name: Deterministic installer and download integrity tests (no weights or device)
        run: |
          python3 -m unittest discover -s runtime/setup -v
          python3 -m compileall -q runtime/setup project-creator
      - name: Deterministic NPU protocol and model profile tests (no weights or device)
        run: python3 -m unittest discover -s runtime/npu -v
      - run: node --test scripts/*.test.mjs
      # Integration packages share a database-wide model advisory lock even
      # though their tables use separate schemas. Parallel packages can starve
      # each other's fake generators and trigger model-start timeouts.
      - run: go test -p 1 ./...
      - run: go vet ./...
      - run: |
          go run ./cmd/codegen
          git diff --exit-code -- graph/models_gen.go
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Audit locked frontend dependencies
        run: bun audit
        working-directory: frontend
      - run: bun run lint:ci
        working-directory: frontend
      - run: bun run codegen && git diff --exit-code -- lib/generated.ts
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run typecheck && bun run build
        working-directory: frontend
      - name: Prepare Chromium headless shell
        run: |
          bunx playwright install --only-shell chromium
          bunx playwright screenshot --browser chromium about:blank "$RUNNER_TEMP/chromium-probe.png" || bunx playwright install-deps chromium
        timeout-minutes: 10
        working-directory: frontend
      - name: Deterministic desktop and narrow UX regressions
        run: bun run test:ux
        working-directory: frontend
      - name: Capture desktop screenshots
        run: bun run e2e -- --grep 'screenshots:'
        working-directory: frontend
      - run: bun run e2e -- --grep-invert 'screenshots:'
        working-directory: frontend
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          retention-days: 3
          path: frontend/screenshots/*.png
          if-no-files-found: warn


  containers:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: project-creator-ci-smoke
      COMPOSE_FILE: compose.yml:compose.smoke.yml
      COMPOSE_ENV_FILE: .env.smoke.example
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Decide whether to build optional Vulkan images
        id: vulkan
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare the tested merge tree to its base. Unknown paths or a missing base keep full verification.
          if git diff --quiet --no-renames "$PR_BASE_SHA" HEAD -- . \
              ':(exclude)cmd' ':(exclude)contracts' ':(exclude)docs' ':(exclude)frontend' \
              ':(exclude)graph' ':(exclude)internal' ':(exclude)testdata' ':(exclude)go.mod' ':(exclude)go.sum'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Validate CPU and optional GPU configuration
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" config --quiet
          docker compose --env-file "$COMPOSE_ENV_FILE" -f compose.yml -f compose.gpu.yml config --quiet
          docker compose --env-file "$COMPOSE_ENV_FILE" -f compose.yml -f compose.intel.yml config --quiet
          PROJECT_CREATOR_NPU_PROFILE=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa NPU_SOCKET_GID=1000 NPU_SOCKET_DIR=/tmp/project-creator-npu docker compose --env-file "$COMPOSE_ENV_FILE" -f compose.yml -f compose.npu.yml config --quiet
          PROJECT_CREATOR_GPU_ID=GPU-1234abcd docker compose --env-file "$COMPOSE_ENV_FILE" -f compose.yml -f compose.amd.yml config --quiet
          GGML_VK_VISIBLE_DEVICES=0 docker compose --env-file "$COMPOSE_ENV_FILE" -f compose.yml -f compose.amd-vulkan.yml config --quiet
          node --test scripts/intel-compose.check.mjs scripts/npu-compose.check.mjs scripts/gpu-compose.check.mjs
      - name: Free space for large Docker layers
        if: steps.vulkan.outputs.skip != 'true'
        # This job uses an ephemeral GitHub-hosted runner, never a developer host.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /
      - name: Set up cached Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build Intel Vulkan runtime (no GPU required)
        if: steps.vulkan.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ollama-intel
          load: true
          push: false
          provenance: false
          tags: project-creator-ollama-intel:0.40.16
          cache-from: type=gha,version=2,scope=ci-intel-v1
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,version=2,scope=ci-intel-v1,mode=max,ignore-error=true,timeout=60s' || '' }}
      - name: Verify Intel Vulkan runtime
        if: steps.vulkan.outputs.skip != 'true'
        run: docker run --rm --entrypoint sh project-creator-ollama-intel:0.40.16 -c 'test -s /etc/project-creator-intel-vulkan.json && cat /etc/project-creator-intel-vulkan.json && ollama --version'
      - name: Release verified Intel image and builder data
        if: steps.vulkan.outputs.skip != 'true'
        # The Intel image is already verified and its cache export has finished.
        run: |
          docker image rm project-creator-ollama-intel:0.40.16
          docker buildx prune --all --force
      - name: Build and verify AMD RADV Vulkan runtime (no GPU required)
        if: steps.vulkan.outputs.skip != 'true'
        # Keep the three existing remote caches; release this image before the app builds.
        run: |
          docker buildx build --load -f Dockerfile.ollama-amd-vulkan -t project-creator-ollama-amd-vulkan:0.40.16 .
          docker run --rm --entrypoint sh project-creator-ollama-amd-vulkan:0.40.16 -c 'test -s /etc/project-creator-amd-vulkan.json && ollama --version'
          docker image rm project-creator-ollama-amd-vulkan:0.40.16
          docker buildx prune --all --force
      - name: Build backend with cached layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          tags: project-creator-ci-smoke-backend:latest
          cache-from: type=gha,version=2,scope=ci-backend-v1
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,version=2,scope=ci-backend-v1,mode=max,ignore-error=true,timeout=60s' || '' }}
      - name: Build frontend with cached layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          provenance: false
          tags: project-creator-ci-smoke-frontend:latest
          cache-from: type=gha,version=2,scope=ci-frontend-v1
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,version=2,scope=ci-frontend-v1,mode=max,ignore-error=true,timeout=60s' || '' }}
      - name: Build and start clean disposable stack
        run: docker compose --env-file "$COMPOSE_ENV_FILE" up -d --no-build --wait --wait-timeout 180
      - name: Exercise HTTP model workflow and restart persistence
        run: node scripts/compose-smoke.mjs
      - name: Show container diagnostics
        if: failure()
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" ps -a
          docker compose --env-file "$COMPOSE_ENV_FILE" logs --no-color --tail=150
      - name: Remove disposable containers and data
        if: always()
        run: docker compose --env-file "$COMPOSE_ENV_FILE" down --volumes --remove-orphans


  automerge:
    outputs:
      issues: ${{ steps.merge.outputs.issues }}
    needs: [checks, containers]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop' &&
      needs.checks.result == 'success' && needs.containers.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: Merge an explicitly labeled PR at the tested SHA
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-automerge.mjs

  close-issues:
    needs: automerge
    if: needs.automerge.outputs.issues != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Close designated issues as completed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBERS: ${{ needs.automerge.outputs.issues }}
        shell: bash
        run: |
          for number in $ISSUE_NUMBERS; do
            path="repos/$GITHUB_REPOSITORY/issues/$number"
            state=$(gh api "$path" --jq 'if .pull_request then "pull_request" else .state end')
            if [[ "$state" == open ]]; then
              gh api --method PATCH "$path" -f state=closed -f state_reason=completed --silent
            fi
          done
