name: Draft prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag (initial prerelease: v0.1.0)'
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA to validate and release
        required: true
        type: string
      notes_sha:
        description: Full 40-character Project Creator Wiki commit SHA for release notes
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: project_creator
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: project_creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_creator -d project_creator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://project_creator:ci-test-password@127.0.0.1:5432/project_creator_test?sslmode=disable
      E2E_DATABASE_URL: postgresql://project_creator:ci-test-password@127.0.0.1:5432/project_creator_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release input, source tag, and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NOTES_SHA: ${{ inputs.notes_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          git fetch origin main --tags
          node --input-type=module -e '
            import { validateReleaseInput } from "./scripts/release-validation.mjs";
            validateReleaseInput({ tag: process.env.RELEASE_TAG, sourceSha: process.env.SOURCE_SHA, notesSha: process.env.NOTES_SHA, ref: process.env.DISPATCH_REF });
          '
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Require successful CI on main at the exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          runs=$(gh run list --workflow ci.yml --branch main --commit "$SOURCE_SHA" --json headSha,status,conclusion,event,headBranch)
          node --input-type=module -e '
            import { validateSuccessfulMainCi } from "./scripts/release-validation.mjs";
            let input = ""; for await (const chunk of process.stdin) input += chunk;
            const runs = JSON.parse(input);
            validateSuccessfulMainCi(runs, process.env.SOURCE_SHA);
          ' <<< "$runs"
      - name: Prepare draft release notes from the pinned Wiki commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NOTES_SHA: ${{ inputs.notes_sha }}
        run: bash scripts/prepare-release-notes.sh
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Prepare isolated E2E database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE project_creator_e2e'
      - name: Go tests, vet, and generated-code check
        run: |
          go test -p 1 ./...
          go vet ./...
          go run ./cmd/codegen
          git diff --exit-code -- graph/models_gen.go
      - name: Frontend tests, typecheck, and production build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun audit
          bun run lint:ci
          bun run codegen
          git diff --exit-code -- lib/generated.ts
          bun run test
          bun run typecheck
          bun run build
      - name: Build backend and frontend containers
        run: |
          docker build -f Dockerfile -t project-creator-release-backend:"$SOURCE_SHA" .
          docker build -f frontend/Dockerfile -t project-creator-release-frontend:"$SOURCE_SHA" .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag --target "$SOURCE_SHA" --title "Source + Compose $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes-draft.md"
