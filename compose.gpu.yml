# Optional NVIDIA acceleration; requires NVIDIA Container Toolkit on the host.
services:
  ollama:
    profiles: !reset []
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PROJECT_CREATOR_GPU_ID:-0}"]
              capabilities: [gpu]
    environment:
      OLLAMA_VULKAN: '0'
  backend:
    depends_on:
      ollama:
        condition: service_healthy
