# Enable only configured API roles. The base application has no model dependency.
services:
  backend:
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    environment:
      PROJECT_CREATOR_GENERATOR_RUNTIME: ${PROJECT_CREATOR_GENERATOR_RUNTIME:-${PROJECT_CREATOR_GENERATOR_MODEL:+openai-compatible}}
      PROJECT_CREATOR_EMBEDDING_RUNTIME: ${PROJECT_CREATOR_EMBEDDING_RUNTIME:-${PROJECT_CREATOR_EMBEDDING_MODEL:+openai-compatible}}
  ollama:
    profiles: [local-models, tools]
