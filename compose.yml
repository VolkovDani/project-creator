services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: project_creator
      POSTGRES_DB: project_creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_creator -d project_creator"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROJECT_CREATOR_ADDR: 0.0.0.0:8080
      PROJECT_CREATOR_DATABASE_URL: postgresql://project_creator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/project_creator?sslmode=disable
      PROJECT_CREATOR_TOKEN: ${PROJECT_CREATOR_TOKEN:?Set PROJECT_CREATOR_TOKEN in .env}
      PROJECT_CREATOR_OLLAMA_URL: http://ollama:11434
      PROJECT_CREATOR_EMBEDDING_RUNTIME: ${PROJECT_CREATOR_EMBEDDING_RUNTIME:-}
      PROJECT_CREATOR_GENERATOR_RUNTIME: ${PROJECT_CREATOR_GENERATOR_RUNTIME:-}
      PROJECT_CREATOR_ANALYSIS_DEFAULT_THRESHOLD: ${PROJECT_CREATOR_ANALYSIS_DEFAULT_THRESHOLD:-}
      PROJECT_CREATOR_EMBEDDING_API_KEY: ${PROJECT_CREATOR_EMBEDDING_API_KEY:-}
      PROJECT_CREATOR_GENERATOR_API_KEY: ${PROJECT_CREATOR_GENERATOR_API_KEY:-}
      PROJECT_CREATOR_EMBEDDING_DIMENSIONS: ${PROJECT_CREATOR_EMBEDDING_DIMENSIONS:-}
      PROJECT_CREATOR_EMBEDDING_URL: ${PROJECT_CREATOR_EMBEDDING_URL:-}
      PROJECT_CREATOR_GENERATOR_URL: ${PROJECT_CREATOR_GENERATOR_URL:-}
      PROJECT_CREATOR_SUMMARY_URL: ${PROJECT_CREATOR_SUMMARY_URL:-http://ollama:11434}
      PROJECT_CREATOR_SUMMARY_MODEL: ${PROJECT_CREATOR_SUMMARY_MODEL:-}
      PROJECT_CREATOR_SUMMARY_LANGUAGES: ${PROJECT_CREATOR_SUMMARY_LANGUAGES:-ru,en}
      PROJECT_CREATOR_SUMMARY_DIGEST: ${PROJECT_CREATOR_SUMMARY_DIGEST:-}
      PROJECT_CREATOR_EMBEDDING_MODEL: ${PROJECT_CREATOR_EMBEDDING_MODEL:-}
      PROJECT_CREATOR_EMBEDDING_DIGEST: ${PROJECT_CREATOR_EMBEDDING_DIGEST:-}
      PROJECT_CREATOR_GENERATOR_MODEL: ${PROJECT_CREATOR_GENERATOR_MODEL:-}
      PROJECT_CREATOR_GENERATOR_DIGEST: ${PROJECT_CREATOR_GENERATOR_DIGEST:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PROJECT_CREATOR_TOKEN: ${PROJECT_CREATOR_TOKEN:?Set PROJECT_CREATOR_TOKEN in .env}
      PROJECT_CREATOR_GRAPHQL_URL: http://backend:8080/graphql
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{projects(limit:1,offset:0){id}}'}),signal:AbortSignal.timeout(4000)}).then(async r=>{const x=await r.json();if(!r.ok||x.errors||!Array.isArray(x.data?.projects))process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  model-info:
    image: node:26.13.1-bookworm-slim
    profiles: [tools]
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - node
      - -e
      - >-
        fetch('http://ollama:11434/api/tags',{signal:AbortSignal.timeout(10000)}).then(async r=>{if(!r.ok)throw Error('Ollama unavailable');console.log(JSON.stringify(await r.json(),null,2))}).catch(e=>{console.error(e.message);process.exit(1)})
volumes:
  postgres_data:
  ollama_data:
