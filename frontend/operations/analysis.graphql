fragment CompactAnalysisSnapshot on ProjectAnalysisSummary { revision mode similarityThreshold possiblePairs notSelectedPairs duplicatePairs reusedPairs newPairs completedPairs pendingPairs runningPairs failedPairs collisionPairs compatiblePairs insufficientPairs id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale stage totalPairs processedPairs activePairId }
fragment AnalysisSnapshot on ProjectAnalysis { revision mode similarityThreshold possiblePairs notSelectedPairs duplicatePairs reusedPairs newPairs completedPairs pendingPairs runningPairs failedPairs collisionPairs compatiblePairs insufficientPairs id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale stage totalPairs processedPairs activePairId }
query ProjectAnalysisStatus($projectId: ID!, $analysisId: ID) { projectAnalysis(projectId:$projectId,analysisId:$analysisId) { mode similarityThreshold selectionProfile possiblePairs notSelectedPairs duplicatePairs reusedPairs newPairs completedPairs pendingPairs runningPairs failedPairs collisionPairs compatiblePairs insufficientPairs generatorProvenance id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale generatorProfile embeddingProfile stage totalPairs processedPairs activePairId sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } pairs { selectionReasons similarityScore resultOrigin reusedFrom checkedAt generatorProfile id position status left { id version text } right { id version text } verdict explanation errorCode } } }
mutation StartProjectAnalysis($projectId: ID!, $mode:String, $threshold:Float) { startProjectAnalysis(projectId:$projectId,mode:$mode,threshold:$threshold) { ...AnalysisSnapshot } }
mutation ReplaceProjectAnalysis($projectId: ID!, $analysisId: ID!, $mode: String, $threshold: Float, $strategy: String!) { replaceProjectAnalysis(projectId: $projectId, analysisId: $analysisId, mode: $mode, threshold: $threshold, strategy: $strategy) { ...AnalysisSnapshot } }
mutation RetryProjectAnalysis($projectId: ID!, $analysisId: ID!) { retryProjectAnalysis(projectId:$projectId, analysisId:$analysisId) { ...AnalysisSnapshot } }

query AnalysisPairPage($projectId: ID!, $analysisId: ID!, $limit: Int!, $offset: Int!, $status: String!, $verdict: String!) { scope:projectAnalysisSummary(projectId:$projectId,analysisId:$analysisId) { projectId __typename } analysisPairs(projectId:$projectId,analysisId:$analysisId,limit:$limit,offset:$offset,status:$status,verdict:$verdict) { id position status left { id version } right { id version } verdict errorCode selectionReasons similarityScore resultOrigin reusedFrom checkedAt generatorProfile } }
query AnalysisHistory($projectId:ID!, $limit:Int!, $offset:Int!) { analysisHistory(projectId:$projectId,limit:$limit,offset:$offset) { mode similarityThreshold selectionProfile possiblePairs notSelectedPairs duplicatePairs id projectId createdAt status generatorProfile stale } }

query AnalysisPairConnection($projectId: ID!, $analysisId: ID!, $first: Int!, $after: String, $status: String!, $verdict: String!) { scope:projectAnalysisSummary(projectId:$projectId,analysisId:$analysisId) { projectId __typename } analysisPairsConnection(projectId:$projectId, analysisId:$analysisId, first:$first, after:$after, status:$status, verdict:$verdict) { edges { cursor node { id position status left { id version } right { id version } verdict errorCode selectionReasons similarityScore resultOrigin reusedFrom checkedAt generatorProfile } } pageInfo { endCursor hasNextPage } totalCount } }

query ProjectAnalysisSummary($projectId: ID!, $analysisId: ID) { projectAnalysis:projectAnalysisSummary(projectId:$projectId,analysisId:$analysisId) { ...CompactAnalysisSnapshot } }

mutation CancelProjectAnalysis($projectId: ID!, $analysisId: ID!) { cancelProjectAnalysis(projectId:$projectId, analysisId:$analysisId) { ...AnalysisSnapshot } }
query AnalysisPairDetail($projectId:ID!, $analysisId:ID!, $pairId:ID!) { analysisPair(projectId:$projectId,analysisId:$analysisId,pairId:$pairId) { id position status left { id version text } right { id version text } verdict explanation errorCode selectionReasons similarityScore resultOrigin reusedFrom checkedAt generatorProfile } }
query AnalysisRunMetadata($projectId:ID!, $analysisId:ID!) { projectAnalysis:analysisRunMetadata(projectId:$projectId,analysisId:$analysisId) { id projectId generatorProfile generatorProvenance embeddingProfile selectionProfile } }
