query ProjectAnalysisStatus($projectId: ID!) { projectAnalysis(projectId:$projectId) { id projectId status outcome errorCode createdAt completedAt stale generatorProfile embeddingProfile sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } } }
mutation StartProjectAnalysis($projectId: ID!) { startProjectAnalysis(projectId:$projectId) { id projectId status outcome errorCode createdAt completedAt stale generatorProfile embeddingProfile sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } } }
