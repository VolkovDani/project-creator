query ProjectAnalysisStatus($projectId: ID!) { projectAnalysis(projectId:$projectId) { id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale generatorProfile embeddingProfile stage totalPairs processedPairs activePairId sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } pairs { id position status left { id version text } right { id version text } verdict explanation errorCode } } }
mutation StartProjectAnalysis($projectId: ID!) { startProjectAnalysis(projectId:$projectId) { id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale generatorProfile embeddingProfile stage totalPairs processedPairs activePairId sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } pairs { id position status left { id version text } right { id version text } verdict explanation errorCode } } }
mutation RetryProjectAnalysis($projectId: ID!, $analysisId: ID!) { retryProjectAnalysis(projectId:$projectId, analysisId:$analysisId) { id projectId status outcome errorCode reasonCode missingRequirementIds createdAt completedAt stale generatorProfile embeddingProfile stage totalPairs processedPairs activePairId sources { id version text } findings { leftId rightId leftVersion rightVersion verdict explanation } pairs { id position status left { id version text } right { id version text } verdict explanation errorCode } } }
