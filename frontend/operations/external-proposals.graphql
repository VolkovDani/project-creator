query ExternalProposals($projectId: ID!, $after: String) {
  externalProposals(projectId: $projectId, after: $after) {
    items {
      id
      analysis
      limitations
      client
      model
      sharing
      status
      createdAt
      glossarySources { termId version status }
      sources {
        requirementId
        version
        status
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
