fragment GlossaryFields on GlossaryTerm {
  id name definition context variants { text kind } version sourceId sourceVersion createdAt updatedAt
}
query GlossaryList($projectId: ID!, $search: String!, $limit: Int!, $offset: Int!) {
  glossaryTerms(projectId: $projectId, search: $search, limit: $limit, offset: $offset) { ...GlossaryFields }
}
query GlossaryTermsByIds($projectId: ID!, $ids: [ID!]!) {
  glossaryTermsByIds(projectId: $projectId, ids: $ids) { ...GlossaryFields }
}
query GlossaryCandidates($projectId: ID!, $limit: Int!, $offset: Int!) {
  glossaryCandidates(projectId: $projectId, limit: $limit, offset: $offset) { hasMore items { name abbreviation sourceId sourceVersion } }
}
query RequirementGlossary($projectId: ID!, $analysisId: ID, $requirementId: ID!, $version: Int!) {
  requirementGlossary(projectId: $projectId, analysisId: $analysisId, requirementId: $requirementId, version: $version) {
    version matches { start end terms { id } }
  }
}
mutation SaveTerm($input: GlossaryInput!) {
  saveGlossaryTerm(input: $input) { term { ...GlossaryFields } fieldErrors { path code messageKey params { key value } } }
}
mutation DeleteTerm($projectId: ID!, $id: ID!, $version: Int!) {
  deleteGlossaryTerm(projectId: $projectId, id: $id, version: $version) { deleted }
}
query GlossaryTermPages($projectId: ID!, $search: String!, $after: String) {
 glossaryTermsConnection(projectId:$projectId,search:$search,after:$after,first:20){items{...GlossaryFields} pageInfo{endCursor hasNextPage}}
}
query GlossaryCandidatePages($projectId: ID!, $after: String) {
 glossaryCandidatesConnection(projectId:$projectId,after:$after,first:20){items{name abbreviation sourceId sourceVersion before after start end} pageInfo{endCursor hasNextPage}}
}
query GlossaryMentions($projectId: ID!, $termId: ID!, $after: String) {
 glossaryMentions(projectId:$projectId,termId:$termId,first:20,after:$after){items{id text version} pageInfo{endCursor hasNextPage}}
}
mutation SuggestGlossaryDefinition($input: SuggestGlossaryDefinitionInput!) {
  suggestGlossaryDefinition(input: $input) {
    definition status fieldErrors { path code messageKey params { key value } }
  }
}
