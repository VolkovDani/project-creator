fragment ProcessGraphRunFields on ProcessGraphRunPayload {
  status
  run {
    id
    topic
    revision
    completed
    total
    failed
  }
  draft {
    nodes {
      id
      kind
      label
    }
    edges {
      from
      to
      kind
      label
      evidence {
        requirementId
        version
        start
        end
        quote
      }
    }
    sourceCount
    partial
  }
  fieldErrors {
    path
    code
    messageKey
    params {
      key
      value
    }
  }
}

mutation StartBackgroundProcessGraph($input: BuildProcessGraphInput!) {
  startBackgroundProcessGraph(input: $input) {
    ...ProcessGraphRunFields
  }
}

query LatestProcessGraphRun($projectId: ID!) {
  latestProcessGraphRun(projectId: $projectId) {
    ...ProcessGraphRunFields
  }
}
