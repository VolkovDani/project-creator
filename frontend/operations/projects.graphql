query ProjectList($limit: Int!, $offset: Int!) { projects(limit: $limit, offset: $offset) { id name goal description createdAt updatedAt } }
query ProjectDetail($id: ID!) { project(id: $id) { id name goal description createdAt updatedAt } }
mutation CreateProject($input: ProjectInput!) { createProject(input: $input) { project { id name goal description createdAt updatedAt } fieldErrors { path code messageKey params { key value } } } }
query Requirements($projectId: ID!, $limit: Int!, $offset: Int!) { requirements(projectId: $projectId, limit: $limit, offset: $offset) { id projectId text version createdAt updatedAt } }
mutation AddRequirement($input: CreateRequirementInput!) { createRequirement(input:$input) { requirement { id text version } fieldErrors { path code messageKey params { key value } } } }
mutation EditRequirement($input: UpdateRequirementInput!) { updateRequirement(input:$input) { requirement { id text version } fieldErrors { path code messageKey params { key value } } } }
mutation RemoveRequirement($id: ID!, $projectId: ID!, $version: Int!) { deleteRequirement(id:$id, projectId:$projectId, version:$version) { deleted } }
