query RequirementSummariesByIds($projectId: ID!, $requirementIds: [ID!]!) {
  requirementSummariesByIds(projectId: $projectId, requirementIds: $requirementIds) {
    requirementId
    projectId
    version
    status
    text
    glossaryMatches { start end terms { id } }
    profile
    createdAt
    errorCode
    byteLength
    layaEligible
  }
}

query RequirementSummaryProvenance($projectId: ID!, $requirementIds: [ID!]!) {
  requirementSummariesByIds(projectId: $projectId, requirementIds: $requirementIds) {
    requirementId
    projectId
    version
    status
    profile
    createdAt
    provenance
  }
}

mutation RetryRequirementSummary($projectId: ID!, $requirementId: ID!) {
  retryRequirementSummary(projectId: $projectId, requirementId: $requirementId) {
    requirementId
    projectId
    version
    status
    text
    profile
    createdAt
    errorCode
    byteLength
    layaEligible
  }
}

mutation CancelRequirementSummary($projectId: ID!, $requirementId: ID!) {
  cancelRequirementSummary(projectId: $projectId, requirementId: $requirementId) {
    requirementId
    projectId
    version
    status
    text
    profile
    createdAt
    errorCode
    byteLength
    layaEligible
  }
}

query FailedRequirementSummaryCount($projectId: ID!) {
  failedRequirementSummaryCount(projectId: $projectId)
}

mutation RetryFailedRequirementSummaries($projectId: ID!) {
  retryFailedRequirementSummaries(projectId: $projectId)
}
